<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="side-panel">
            <div class="collapse-button-container">
                <button class="collapse-button"><img src="image.png" width="25px" ></button>
            </div>
            <div class="top-panel">
                <input id="grid-size" title="grid size" type="number" value="16" min="2" max="64">
                <input id="paint-color" title="paint color" type="color" value="yellow">
                <input id="border-color" title="border color" type="color" value="red">
                <input id="border-width" title="border width" type="number" value="2" min="0", max="10">
            </div>
        </div>
        <div class="main-panel">
        </div>
    </div>
</body>
</html>
